name: Dependency audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Validate and install the frozen lockfile
        run: bun ci --ignore-scripts
      - name: Audit all dependencies, including build and test tooling
        shell: bash
        run: bun run audit:dependencies --json | tee "$RUNNER_TEMP/dependency-audit.json"
      - name: Save the full advisory report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
